name: Publish to npm

on:
  release:
    types: [published]

permissions: {}

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    if: startsWith(github.event.release.tag_name, 'v')
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install npm with OIDC support
        run: npm install -g npm@11.5.1

      - run: npm ci

      - run: npm run build

      - run: npm test

      - name: Verify package
        run: npx @arethetypeswrong/cli --pack .

      - name: Publish to npm
        run: npm publish --access public
        # No NODE_AUTH_TOKEN — OIDC Trusted Publishing handles auth automatically
