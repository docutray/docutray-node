name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main, 'feat/**']

permissions:
  contents: read

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test:coverage

  package:
    name: Package verification
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run 2>&1 | tee pack-output.txt

      - name: Check types with attw
        run: npx @arethetypeswrong/cli --pack .

      - name: Verify ESM import
        run: node --input-type=module -e "import DocuTray from './dist/index.mjs'; if (typeof DocuTray !== 'function') { process.exit(1); } console.log('ESM import: OK');"

      - name: Verify CJS require
        run: node -e "const m = require('./dist/index.js'); const C = m.default || m; if (typeof C !== 'function') { process.exit(1); } console.log('CJS require: OK');"
